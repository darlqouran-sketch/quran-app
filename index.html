<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بلغوا عني | V42.6</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&family=Amiri:ital@1&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-messaging-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100%; font-family: 'Cairo', sans-serif; overflow: hidden; background-color: #000b18; direction: rtl; color: white; }
        .bg-container { position: absolute; inset: 0; background: url('https://fv5-4.files.fm/thumb.php?i=wf96xqfs9c&v=1&n=Ramadan+Kareem+Background+In+Blue+And+Gold+Theme+With+Arabic+Lanterns+Mosque+Backgrounds+_+AI+Free+Download+-+Pikbest_cropped.jpg') center/cover; z-index: 1; }
        .overlay { position: absolute; inset: 0; background: rgba(0, 11, 24, 0.75); z-index: 2; }
        .main-wrapper { position: relative; width: 100%; height: 100%; z-index: 3; }
        .page { display: none; width: 100%; height: 100%; justify-content: center; align-items: center; padding: 20px; }
        .page.active { display: flex; }
        .card { background: rgba(0, 15, 30, 0.9); backdrop-filter: blur(15px); padding: 25px; border-radius: 25px; text-align: center; width: 100%; max-width: 450px; border: 1px solid #d4af37; box-shadow: 0 0 40px rgba(0,0,0,0.5); }
        .welcome-inline { font-size: 0.85rem; margin-bottom: 20px; font-family: 'Amiri', serif; color: #f1c40f; padding: 12px; border: 1px dashed #d4af37; background: rgba(255,255,255,0.03); border-radius: 12px; }
        .select-box { background: #001a33; border: 1px solid #d4af37; border-radius: 10px; color: #f1c40f; padding: 12px; width: 100%; margin-bottom: 10px; outline: none; }
        .countdown { display: flex; justify-content: center; gap: 8px; direction: ltr; margin: 15px 0; }
        .box { background: rgba(212, 175, 55, 0.1); padding: 10px; border-radius: 12px; border-bottom: 3px solid #27ae60; flex: 1; }
        .num { font-size: 1.5rem; font-weight: bold; color: #f1c40f; display: block; }
        .nav-side { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: space-between; padding: 0 25px; z-index: 1000; }
        .side-btn { cursor: pointer; text-align: center; transition: 0.3s; }
        .side-btn.hidden { visibility: hidden; }
        .arrow-box { background: rgba(212, 175, 55, 0.2); border: 1px solid #d4af37; color: #f1c40f; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; margin: 0 auto; }
        .side-text { color: #fff; font-size: 0.75rem; margin-top: 5px; display: block; background: rgba(0,0,0,0.5); padding: 2px 8px; border-radius: 5px; }
        audio { width: 100%; margin-top: 10px; filter: sepia(20%) saturate(70%) hue-rotate(10deg); }
    </style>
</head>
<body>
    <div class="bg-container"></div>
    <div class="overlay"></div>

    <div class="main-wrapper">
        <div class="page active" id="p0">
            <div class="card">
                <div id="welcome-msg" class="welcome-inline">--</div>
                <h2 style="color:#f1c40f; font-family:'Amiri'; margin-bottom:15px;">القرآن الكريم</h2>
                <select id="reciterSelect" class="select-box"></select>
                <select id="surahSelect" class="select-box"></select>
                <audio id="quranPlayer" controls></audio>
                <p class="copyright cp-text" style="margin-top:15px; font-size:0.7rem; color:#d4af37;"></p>
            </div>
        </div>

        <div class="page" id="p1">
            <div class="card">
                <h2 style="color:#f1c40f; font-family:'Amiri'; margin-bottom:15px;">صَحِيحُ البُخَارِيِّ</h2>
                <select id="hadithSelect" class="select-box"></select>
                <audio id="hadithPlayer" controls></audio>
                <p class="copyright cp-text" style="margin-top:15px; font-size:0.7rem; color:#d4af37;"></p>
            </div>
        </div>

        <div class="page" id="p2">
            <div class="card">
                <h2 id="t-title" style="color:#f1c40f; font-family:'Amiri'; margin-bottom:15px;">الأذكار</h2>
                <div style="display:flex; align-items:center; gap:10px; margin-bottom:15px;">
                    <div onclick="moveCycle(-1)" style="font-size:2rem; cursor:pointer; color:#f1c40f;">▶</div>
                    <div style="flex:1">
                        <div id="tasbih-txt" style="font-family:'Amiri'; min-height:80px; font-size:1.1rem; display:flex; align-items:center; justify-content:center;">--</div>
                        <small id="target-lbl" style="color:#d4af37;"></small>
                    </div>
                    <div onclick="moveCycle(1)" style="font-size:2rem; cursor:pointer; color:#f1c40f;">◀</div>
                </div>
                <div id="tasbih-count" style="font-size:3.5rem; color:#f1c40f; font-weight:bold; margin-bottom:10px;">0</div>
                <button onclick="handleTasbih()" style="width:90px; height:90px; border-radius:50%; border:2px solid #d4af37; background:none; color:white; font-family:'Cairo';" id="t-btn">ذكر</button>
                <p class="copyright cp-text" style="margin-top:15px; font-size:0.7rem; color:#d4af37;"></p>
            </div>
        </div>

        <div class="page" id="p3">
            <div class="card">
                <select id="eventSelect" class="select-box" onchange="updateCountdown()">
                    <option value="adha">عيد الأضحى</option>
                    <option value="ramadan">شهر رمضان</option>
                    <option value="fitr">عيد الفطر</option>
                </select>
                <div id="remain-label" style="color:#f1c40f; font-size:0.8rem; margin-top:10px;">--</div>
                <h2 id="eventTitle" style="font-family:'Amiri'; margin:10px 0;">--</h2>
                <div class="countdown">
                    <div class="box"><span id="days" class="num">00</span><small id="l-days">--</small></div>
                    <div class="box"><span id="hours" class="num">00</span><small id="l-hours">--</small></div>
                    <div class="box"><span id="minutes" class="num">00</span><small id="l-mins">--</small></div>
                    <div class="box"><span id="seconds" class="num">00</span><small id="l-secs">--</small></div>
                </div>
                <p class="copyright cp-text" style="margin-top:15px; font-size:0.7rem; color:#d4af37;"></p>
            </div>
        </div>
    </div>

    <div class="nav-side">
        <div id="btnPrev" class="side-btn hidden" onclick="switchPage(-1)"><div class="arrow-box">→</div><span id="prev-text" class="side-text">--</span></div>
        <div id="btnNext" class="side-btn" onclick="switchPage(1)"><div class="arrow-box">←</div><span id="next-text" class="side-text">--</span></div>
    </div>

    <script>
        const config = {
            apiKey: "AIzaSyDoruiRI56JGr6Kye8DUd6y2if9zqCxLrQ",
            authDomain: "mbarek-84c23.firebaseapp.com",
            databaseURL: "https://mbarek-84c23-default-rtdb.firebaseio.com",
            projectId: "mbarek-84c23"
        };
        firebase.initializeApp(config);

        const surahs = ["الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس","هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه","الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس","التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد","الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات","القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الإخلاص","الفلق","الناس"];
        const bukhari = ["بدء الوحي", "الإيمان", "العلم", "الوضوء", "الغسل", "الحيض", "التيمم", "الصلاة", "مواقيت الصلاة", "الأذان", "الجمعة", "الخوف", "العيدين", "الوتر", "الاستسقاء", "الكسوف", "سجود القرآن", "تقصير الصلاة", "التهجد", "فضل الصلاة بمكة والمدينة", "السهو", "الجنائز", "الزكاة", "الحج", "العمرة", "المحصر", "جزاء الصيد", "فضائل المدينة", "الصوم", "صلاة التراويح", "فضل ليلة القدر", "الاعتكاف", "البيوع", "السلم", "الشفعة", "الإجارة", "الحوالات", "الكفالة", "الوكالة", "الحرث والمزارعة", "المساقاة", "الاستقراض", "الخصومات", "اللقطة", "المظالم", "الشركة", "الرهن", "العتق", "المكاتب", "الهبة", "الشهادات", "الصلح", "الشروط", "الوصايا", "الجهاد والسير", "الخمس", "الجزية", "بدء الخلق", "الأنبياء", "المناقب", "فضائل الصحابة", "مناقب الأنصار", "المغازي", "التفسير", "فضائل القرآن", "النكاح", "الطلاق", "النفقات", "الأطعمة", "العقيقة", "الذبائح والصيد", "الأضاحي", "الأشربة", "المرضى", "الطب", "اللباس", "الأدب", "الاستئذان", "الدعوات", "الرقاق", "القدر", "الأيمان والنذور", "كفارات الأيمان", "الفرائض", "الحدود", "المحاربين", "الديات", "استتابة المرتدين", "الإكراه", "الحيل", "تعبير الرؤيا", "الفتن", "الأحكام", "التمني", "أخبار الآحاد", "الاعتصام بالكتاب والسنة", "التوحيد"];
        const reciters = [{n:"أبو بكر الشاطري", u:"shatri"}, {n:"أحمد العجمي", u:"ajm"}, {n:"إدريس أبكر", u:"abkr"}, {n:"خالد الجليل", u:"jleel"}, {n:"خالد القحطاني", u:"qht"}, {n:"سعد الغامدي", u:"s_gmd"}, {n:"عبد الباسط عبد الصمد", u:"basit"}, {n:"علي الحذيفي", u:"hthfi"}, {n:"فارس عباد", u:"frs_a"}, {n:"ماهر المعيقلي", u:"maher"}, {n:"محمد أيوب", u:"ayyub"}, {n:"محمد صديق المنشاوي", u:"minsh"}, {n:"محمد اللحيدان", u:"lhdan"}, {n:"محمود خليل الحصري", u:"husr"}, {n:"محمود علي البنا", u:"bna"}, {n:"مشاري العفاسي", u:"afs"}, {n:"ناصر القطامي", u:"qtm"}, {n:"هزاع البلوشي", u:"hazza"}, {n:"ياسر الدوسري", u:"yasser"}];
        
        const langData = {
            ar: { welcome: "أَهْلًا بِكَ أَخِي / أُخْتِي فِي تَطْبِيقِنَا المُتَوَاضِعِ، نَسْأَلُ اللَّهَ أَنْ يَتَقَبَّلَ مِنَّا وَمِنْكُمْ صَالِحَ الأَعْمَالِ.", days:"أيام", hrs:"ساعات", min:"دقائق", sec:"ثواني", rem:"تبقى لـ:", q:"القرآن", s:"البخاري", t:"الأذكار", c:"العداد", t1:"سُبْحَانَ اللَّهِ", t2:"الْحَمْدُ لِلَّهِ", t3:"اللَّهُ أَكْبَرُ", t4:"لَا إِلَهَ إِلَّا اللَّهُ", t5:"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ", copy: "حقوق النشر © 2026 مبارك تيتشو" }
        };

        let currentPage = 0, tCount = 0, tCycle = 1;
        const targets = [0, 33, 33, 33, 33, 100];
        const eventDates = { adha: "2026-05-27", ramadan: "2027-02-08", fitr: "2027-03-10" };

        function switchPage(dir) {
            document.getElementById(`p${currentPage}`).classList.remove('active');
            currentPage = (currentPage + dir + 4) % 4;
            document.getElementById(`p${currentPage}`).classList.add('active');
            updateNav();
        }

        function updateNav() {
            const pages = ["q", "s", "t", "c"];
            document.getElementById('btnPrev').classList.toggle('hidden', currentPage === 0);
            document.getElementById('btnNext').classList.toggle('hidden', currentPage === 3);
            if(currentPage > 0) document.getElementById('prev-text').innerText = langData.ar[pages[currentPage-1]];
            if(currentPage < 3) document.getElementById('next-text').innerText = langData.ar[pages[currentPage+1]];
        }

        function updateCountdown() {
            const target = new Date(eventDates[document.getElementById('eventSelect').value]).getTime();
            const now = new Date().getTime();
            const diff = target - now;
            if(diff > 0) {
                document.getElementById('days').innerText = Math.floor(diff / 86400000);
                document.getElementById('hours').innerText = Math.floor((diff % 86400000) / 3600000);
                document.getElementById('minutes').innerText = Math.floor((diff % 3600000) / 60000);
                document.getElementById('seconds').innerText = Math.floor((diff % 60000) / 1000);
            }
            const eventNames = { adha: "عيد الأضحى", ramadan: "شهر رمضان", fitr: "عيد الفطر" };
            document.getElementById('eventTitle').innerText = eventNames[document.getElementById('eventSelect').value];
        }

        function handleTasbih() {
            tCount++;
            if(tCount >= targets[tCycle]) moveCycle(1);
            else updateTasbihUI();
        }

        function moveCycle(dir) {
            tCycle = (tCycle + dir);
            if(tCycle > 5) tCycle = 1; if(tCycle < 1) tCycle = 5;
            tCount = 0; updateTasbihUI();
        }

        function updateTasbihUI() {
            document.getElementById('tasbih-txt').innerText = langData.ar['t'+tCycle];
            document.getElementById('tasbih-count').innerText = tCount;
            document.getElementById('target-lbl').innerText = "الهدف: " + targets[tCycle];
        }

        function stopAll() {
            document.getElementById('quranPlayer').pause();
            document.getElementById('hadithPlayer').pause();
        }

        document.addEventListener('DOMContentLoaded', () => {
            // تحميل القراء
            const rSel = document.getElementById('reciterSelect');
            reciters.forEach(r => rSel.add(new Option(r.n, r.u)));
            
            // تحميل السور
            const sSel = document.getElementById('surahSelect');
            surahs.forEach((s, i) => sSel.add(new Option(`${i+1}. ${s}`, (i+1).toString().padStart(3, '0'))));

            // تحميل البخاري
            const hSel = document.getElementById('hadithSelect');
            bukhari.forEach((t, i) => hSel.add(new Option(`${i+1}. ${t}`, (i+1).toString().padStart(2, '0'))));

            // أحداث التشغيل
            rSel.onchange = sSel.onchange = () => {
                stopAll();
                const qp = document.getElementById('quranPlayer');
                const srv = {shatri:11, ajm:10, abkr:6, jleel:10, basit:7, maher:12, afs:8, hazza:11, yasser:11}[rSel.value] || 11;
                qp.src = `https://server${srv}.mp3quran.net/${rSel.value}/${sSel.value}.mp3`;
                qp.play();
            };

            hSel.onchange = () => {
                stopAll();
                const hp = document.getElementById('hadithPlayer');
                hp.src = `https://archive.org/download/Bokharee_up_by_ayoub-islam/${hSel.value}.mp3`;
                hp.play();
            };

            // الـ UI الأساسي
            document.getElementById('welcome-msg').innerText = langData.ar.welcome;
            document.getElementById('remain-label').innerText = langData.ar.rem;
            document.getElementById('l-days').innerText = langData.ar.days;
            document.getElementById('l-hours').innerText = langData.ar.hrs;
            document.getElementById('l-mins').innerText = langData.ar.min;
            document.getElementById('l-secs').innerText = langData.ar.sec;
            document.querySelectorAll('.cp-text').forEach(el => el.innerText = langData.ar.copy);
            
            updateTasbihUI();
            updateNav();
            setInterval(updateCountdown, 1000);
            updateCountdown();
        });
    </script>
</body>
</html>
